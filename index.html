<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>협력사업 신청 현황 · 한도액 자동 판정</title>
<style>
:root{--bg:#f3f1ec;--ink:#1c2830;--mut:#5d6a70;--card:#fffefb;--line:#d9d4c7;--ok:#1f7a4d;--okbg:#e6f4ec;--no:#b3261e;--nobg:#fbe9e7}
@media(prefers-color-scheme:dark){:root{--bg:#141a1d;--ink:#e6edee;--mut:#98a7ab;--card:#1c2529;--line:#2d3a3f;--okbg:#17332448;--nobg:#3b1c1a66;--ok:#5cc58b;--no:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.rule{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:.92rem}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sum{display:flex;gap:18px;font-weight:700;margin:4px 0 14px}
.sum .a{color:var(--ok)}.sum .r{color:var(--no)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-left:6px solid var(--mut);border-radius:10px;padding:12px 14px;background:var(--card)}
.card.ok{border-left-color:var(--ok);background:var(--okbg)}
.card.no{border-left-color:var(--no);background:var(--nobg)}
.org{font-size:.8rem;color:var(--mut)}
.name{font-weight:700;margin:2px 0 8px}
.row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mut)}
.row b{color:var(--ink);font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:8px;padding:1px 10px;border-radius:99px;color:#fff;font-size:.82rem;font-weight:700}
.ok .badge{background:var(--ok)}.no .badge{background:var(--no)}
h2{font-size:1.05rem;margin:26px 0 8px}
iframe{width:100%;height:440px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ph{padding:26px;text-align:center;color:var(--mut);border:2px dashed var(--line);border-radius:10px;font-size:.9rem}
.note{font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>협력사업 신청 현황</h1>
  <p class="sub">신청목록을 카드로 보고, 한도액 초과 여부에 따라 승인·반려를 자동 판정합니다. (금액 단위: 천원)</p>

  <div class="panel rule">
    <label>판정 기준
      <select id="mode">
        <option value="pop">한도액 = 인구수 × 10 (천원)</option>
        <option value="budget">한도액 = 사업별 예산</option>
      </select>
    </label>
    <span class="note">신청액 ≤ 한도액 → 승인 / 초과 → 반려</span>
  </div>

  <div class="sum" id="sum" aria-live="polite"></div>
  <div class="grid" id="grid"></div>

  <h2>신청 자료 핵심 정보 (Google Sheets)</h2>
  <div id="sheet"></div>
</div>

<script id="embedded" type="application/json">[{"지자체명":"가람군","인구수":30000,"신청액":250000,"예산":250000,"사업명":"가람군 청년 농촌 정착 지원 사업"},{"지자체명":"나봄시","인구수":45000,"신청액":500000,"예산":500000,"사업명":"나봄시 스마트 관광 플랫폼 구축"},{"지자체명":"다솔구","인구수":80000,"신청액":600000,"예산":600000,"사업명":"다솔구 어르신 디지털 친화 도시 조성"},{"지자체명":"라윤시","인구수":60000,"신청액":700000,"예산":700000,"사업명":"라윤시 도심 보행자 안전망 구축"},{"지자체명":"마을군","인구수":25000,"신청액":200000,"예산":200000,"사업명":"마을군 지역화폐 활성화 사업"},{"지자체명":"바람시","인구수":100000,"신청액":950000,"예산":950000,"사업명":"바람시 친환경 에너지 전환 사업"},{"지자체명":"사계구","인구수":55000,"신청액":600000,"예산":600000,"사업명":"사계구 청소년 안심 귀가 시스템"},{"지자체명":"아현시","인구수":70000,"신청액":650000,"예산":650000,"사업명":"아현시 도시재생 거점공간 조성"},{"지자체명":"자연군","인구수":40000,"신청액":380000,"예산":380000,"사업명":"자연군 생태관광 마을 조성"},{"지자체명":"차돌시","인구수":90000,"신청액":880000,"예산":880000,"사업명":"차돌시 산업단지 디지털 전환 사업"}]</script>
<script>
/* Google Sheets "웹에 게시 → 임베드" 코드의 src 주소를 아래에 붙여넣으세요 */
const SHEET_SRC = "<iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQyWYKN3WF-nkUmj3HBeOel8aECOgtl0R6CCaubgl9B6P3FHaC7PrMBsznxTri9zDiokN8OyHdhfO5p/pubhtml?gid=1319158201&amp;single=true&amp;widget=true&amp;headers=false"></iframe>";   // 예: "https://docs.google.com/spreadsheets/d/e/2PACX-.../pubhtml?widget=true&headers=false"

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => Number(n).toLocaleString("ko-KR");
let DATA = [];

function limitOf(d){ return $("mode").value === "pop" ? d.인구수 * 10 : d.예산; }
function render(){
  let ok = 0, no = 0;
  $("grid").innerHTML = DATA.map(d => {
    const lim = limitOf(d), pass = d.신청액 <= lim;
    pass ? ok++ : no++;
    return `<article class="card ${pass ? "ok" : "no"}">
      <div class="org">${esc(d.지자체명)}</div>
      <div class="name">${esc(d.사업명)}</div>
      <div class="row"><span>신청 예산</span><b>${won(d.신청액)}</b></div>
      <div class="row"><span>한도액</span><b>${won(lim)}</b></div>
      <span class="badge">${pass ? "승인" : "반려 (" + won(d.신청액 - lim) + " 초과)"}</span>
    </article>`;
  }).join("");
  $("sum").innerHTML = `<span>전체 ${DATA.length}건</span><span class="a">승인 ${ok}건</span><span class="r">반려 ${no}건</span>`;
}
$("mode").addEventListener("change", render);

async function load(){
  try { const r = await fetch("신청목록.json"); if(!r.ok) throw 0; DATA = await r.json(); }
  catch(e){ DATA = JSON.parse($("embedded").textContent); }   // file:// 등 fetch 불가 시 내장본 사용
  render();
}
load();

$("sheet").innerHTML = SHEET_SRC
  ? `<iframe src="${esc(SHEET_SRC)}" title="신청 자료 핵심 정보 Google Sheets" loading="lazy"></iframe>`
  : `<div class="ph">Google Sheets 임베드 주소가 아직 설정되지 않았습니다.<br>index.html 안의 <code>SHEET_SRC</code>에 웹 게시 주소를 넣어 주세요.</div>`;
</script>
</body>
</html>
